name: Ошибка
description: Вылет, чёрный экран, рывки, перегрев, не запускается игра
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете! **Главное: приложите журнал** (Настройки → «Отладка» → «Журналы» → «Сохранить журналы в «Загрузки» (zip)»).
        Сохраните его сразу после проблемы: эмулятор хранит только 3 последние сессии каждого вида.
        Не публикуйте игры, прошивку и ключи. В журнале PKGj могут быть ваши ссылки и zRIF: проверьте перед отправкой.
  - type: input
    id: game
    attributes:
      label: Игра и её ID
      placeholder: Dead or Alive 5 Plus, PCSE00235
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Телефон, процессор/GPU и версия Android
      placeholder: Samsung Galaxy S22+, Exynos 2200 / Xclipse 920, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Redux
      description: Написана в `device-info.txt` внутри zip или в «О приложении».
      placeholder: redux-1.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали, что ожидали увидеть, как часто повторяется. Скриншоты или видео помогают.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Настройки
      description: Профиль производительности, адаптивное разрешение, генерация кадров, фильтр экрана, «Точное планирование потоков».
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я приложил(а) zip с журналами
        - label: Я не публикую игры, прошивку и ключи
