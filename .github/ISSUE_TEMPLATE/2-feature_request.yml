name: Предложение
description: Идея или улучшение
title: "[Идея]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что хотите увидеть
      description: Опишите идею и зачем она нужна. Если это связано с конкретной игрой, укажите её и ID.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Как вы решаете это сейчас
