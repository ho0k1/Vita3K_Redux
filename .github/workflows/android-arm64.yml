name: Android arm64 (fast)

on:
  push:
    branches: ['**']
    # a tag v* builds a signed release APK and publishes it as a GitHub Release (paths filters do not apply to tags)
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'pkgj/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Signed release APK (needs the SIGNING_* secrets, see docs/RELEASE.md)'
        type: boolean
        default: false
      dev_release:
        description: 'Publish the APK as a GitHub pre-release (release files do not count against the Actions storage quota)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true   # новый пуш отменяет предыдущую сборку

jobs:
  android-build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # to attach the release APK to a GitHub Release
    env:
      IS_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1          # история не нужна, сборка не зовёт git describe
          submodules: recursive

      - name: Restore native dependency cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: cache-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            cache-android-native-

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/setup-android.sh

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          max-size: 2G

      - name: Compute artifact paths
        run: |
          echo "ARTIFACT_NAME=vita3k-redux-$(git rev-parse --short HEAD)-android-arm64" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=artifacts/out" >> "$GITHUB_ENV"

      - name: Prepare release signing
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret SIGNING_* for $name is not set. See docs/RELEASE.md"
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SIGNING_STORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}-release"
          } >> "$GITHUB_ENV"

      - name: Build APK (arm64-v8a only)
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash ./.ci/build-android.sh "${{ env.ARTIFACT_DIR }}"

      - run: ccache -s

      # a build started by hand with dev_release: the APK goes to a pre-release instead of an artifact
      - name: Publish dev pre-release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_SHA::7}"
          cp "${{ env.ARTIFACT_DIR }}/app.apk" "Vita3K-Redux-${tag}-arm64-v8a.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "Vita3K-Redux-${tag}-arm64-v8a.apk" --clobber
          else
            gh release create "$tag" "Vita3K-Redux-${tag}-arm64-v8a.apk" --prerelease --target "$GITHUB_SHA" \
              --title "Test build $tag" --notes "Test build from ${GITHUB_SHA} (not a signed release)."
          fi
          # keep only the newest test build: delete the older dev-* pre-releases and their tags
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.prerelease and (.tag_name | startswith("dev-"))) | "\(.id) \(.tag_name)"' |
            while read -r id old; do
              if [ "$old" != "$tag" ]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$old" || true
              fi
            done

      # with the Actions storage quota full this fails; the build itself and the release steps must not depend on it
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
          # the default is 90 days and the Actions storage quota is small
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.IS_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Vita3K-Redux-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp "${{ env.ARTIFACT_DIR }}/app.apk" "$apk"
          # the notes live in the repository: docs/releases/<tag>.md (generated notes when there is no such file)
          notes=(--generate-notes)
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then notes=(--notes-file "docs/releases/${GITHUB_REF_NAME}.md"); fi
          # beta / rc tags are published as pre-releases
          flags=()
          case "$GITHUB_REF_NAME" in *beta*|*rc*|*alpha*) flags=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Vita3K Redux ${GITHUB_REF_NAME}" "${notes[@]}" "${flags[@]}"

      # the unstripped library lets crash frames like libVita3K.so+0x17BAD98 be resolved with addr2line
      - name: Collect native symbols
        run: |
          mkdir -p symbols
          find android/app/build -name libVita3K.so -path "*merged_native_libs*" -prune -o -name libVita3K.so -print | head -3 | while read -r f; do cp "$f" symbols/libVita3K.so && break; done
          ls -la symbols

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_NAME }}-symbols
          path: symbols
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
